services:
  monitor:
    build: .
    command: ["yarn", "monitor"]
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgresql://neondb_owner:npg_hNJyn57adrgx@ep-aged-truth-a1vexyjq-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - API_URL=http://twitter-scraper-api:3000
    depends_on:
      - twitter-scraper-api
    networks:
      - dockge_default
  twitter-scraper-api:
    build: .
    # Switch to the official server implementation
    command: ["yarn", "server:official"]
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgresql://neondb_owner:npg_hNJyn57adrgx@ep-aged-truth-a1vexyjq-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      # Ensure Official API credentials are passed through
      # - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN}
      # - TWITTER_API_KEY=${TWITTER_API_KEY}
      # - TWITTER_API_SECRET=${TWITTER_API_SECRET}
      # - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN}
      # - TWITTER_ACCESS_SECRET=${TWITTER_ACCESS_SECRET}
    networks:
      - dockge_default

networks:
  dockge_default: {}
